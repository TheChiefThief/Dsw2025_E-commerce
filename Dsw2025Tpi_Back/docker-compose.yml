services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dsw2025-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dsw2025Tpi.Api/Dockerfile
    container_name: dsw2025-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Dsw2025Tpi: "Server=sqlserver,1433;Database=Dsw2025Tpi;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False;"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data:
