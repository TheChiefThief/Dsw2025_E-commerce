name: Build, Test and Deploy to Azure App Service (Publish Profile)

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: bernabediaz
  IMAGE_NAME: dsw2025tpi-api

jobs:
  # ==================================================================
  # JOB 1: Quality Gate - Pruebas Unitarias e Integración
  # ==================================================================
  test:
    name: Quality Gate - Pruebas Unitarias e Integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dsw2025Tpi_Back

    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Configurar SDK de .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 3. Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: 4. Ejecutar Suite de Pruebas (.NET API)
        run: dotnet test Dsw2025Tpi.sln --no-restore --verbosity normal

  # ==================================================================
  # JOB 2: Docker build + Deploy a Azure
  # Solo se ejecuta si 'test' finaliza exitosamente (needs: test)
  # ==================================================================
  build-and-deploy:
    name: Build Docker and Deploy
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: Dsw2025Tpi_Back

    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construir la imagen Docker (.NET 8)
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -f Dsw2025Tpi.Api/Dockerfile \
            .

      - name: 4. Subir la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 5. Desplegar el contenedor en Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
